[CONFIG]
hostapd_config_file=/etc/rouge-access-point/hostapd.rouge-access-point.conf
dnsmasq_config_file=/etc/rouge-access-point/dnsmasq.rouge-access-point.conf

[LOGGING]
log_file=/var/log/rouge-access-point/rouge-access-point.log
hostapd_log_file=/var/log/rouge-access-point/hostapd.rouge-access-point.log
dnsmasq_log_file=/var/log/rouge-access-point/dnsmasq.rouge-access-point.log
dnschef_log_file=/var/log/rouge-access-point/dnschef.rouge-access-point.log

[HARDWARE]
broadcast_iface=wlan0
forward_iface=eth0

[AP]
essid=Public-WiFi
bssid=
band=2.4g
channel=11
gateway=192.168.0.1
dhcp_start=192.168.0.100
dhcp_stop=192.168.0.150
dns_server=192.168.0.1

[EVASIONS]
always_spoof_mac_address=true
doh_blocklist_file=/etc/rouge-access-point/rsc/doh-blocklist.txt

[ATTACKS]
dns_overrides_file=/etc/rouge-access-point/rsc/dns-overrides.ini

[BEHAVIOR]
redirect_dns_traffic=true
sinkhole_doh_traffic=true


